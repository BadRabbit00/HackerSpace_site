{% extends 'website/base.html' %}
{% load static %}

{% block title %}Create News | BlackIce{% endblock %}

{% block extra_css %}
<style>
    .create-news-container {
        max-width: 800px;
        margin: 50px auto;
        padding: 40px;
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        position: relative;
        overflow: hidden;
    }

    .create-news-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
    }

    .page-title {
        font-family: 'Orbitron', sans-serif;
        color: #fff;
        text-align: center;
        margin-bottom: 30px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .form-group {
        margin-bottom: 25px;
    }

    .form-label {
        display: block;
        color: var(--accent-color);
        margin-bottom: 10px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.9rem;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        color: #fff;
        border-radius: 4px;
        transition: 0.3s;
    }

    .form-control:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 10px rgba(77, 255, 0, 0.2);
        outline: none;
    }

    .btn-submit {
        display: block;
        width: 100%;
        padding: 15px;
        background: transparent;
        border: 2px solid var(--accent-color);
        color: var(--accent-color);
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        margin-top: 20px;
    }

    .btn-submit:hover {
        background: var(--accent-color);
        color: #000;
        box-shadow: 0 0 20px var(--accent-glow);
    }

    /* File Input Styling */
    input[type="file"] {
        padding: 10px;
        background: #151515;
    }
    
    input[type="file"]::file-selector-button {
        background: #333;
        color: #fff;
        border: none;
        padding: 8px 15px;
        margin-right: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="file"]::file-selector-button:hover {
        background: var(--accent-color);
        color: #000;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="create-news-container">
        <h1 class="page-title">Broadcast Signal</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Headline</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label class="form-label">Short Description (Card)</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label class="form-label">Visual Data</label>
                {{ form.photo }}
            </div>

            <div class="form-group">
                <label class="form-label">Transmission Content</label>
                {{ form.content }}
            </div>

            <button type="submit" class="btn-submit">Initiate Transmission</button>
        </form>
    </div>
</div>
{% endblock %}
